<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Sign Language Recognition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
            50% { box-shadow: 0 0 40px rgba(59, 130, 246, 0.8); }
        }
        .recording {
            animation: pulse-glow 2s ease-in-out infinite;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        #video {
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app"></div>

    <script>
        const API_BASE = 'http://localhost:8000';
        const WS_BASE = 'ws://localhost:8000';

        // State Management
        const state = {
            currentPage: 'login',
            user: null,
            token: localStorage.getItem('token'),
            sessions: [],
            currentSession: null,
            sentence: '',
            registeredWords: [],
            isRecording: false,
            currentPrediction: null,
            confidence: 0,
            ws: null,
            videoStream: null
        };

        // API Helper
        async function apiCall(endpoint, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...(state.token && { 'Authorization': `Bearer ${state.token}` })
            };

            const response = await fetch(`${API_BASE}${endpoint}`, {
                ...options,
                headers: { ...headers, ...options.headers }
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.detail || 'Request failed');
            }

            return response.json();
        }

        // Authentication Functions
        async function login(username, password) {
            try {
                const data = await apiCall('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });

                state.token = data.access_token;
                state.user = data.user;
                localStorage.setItem('token', data.access_token);
                state.currentPage = 'recognition';
                render();
            } catch (error) {
                alert(error.message);
            }
        }

        async function register(username, email, password) {
            try {
                await apiCall('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ username, email, password })
                });

                alert('Registration successful! Please login.');
                state.currentPage = 'login';
                render();
            } catch (error) {
                alert(error.message);
            }
        }

        function logout() {
            state.token = null;
            state.user = null;
            localStorage.removeItem('token');
            state.currentPage = 'login';
            stopRecording();
            render();
        }

        // WebSocket Functions
        async function startRecording() {
            if (state.isRecording) return;

            try {
                // Get video stream
                state.videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });

                const video = document.getElementById('video');
                video.srcObject = state.videoStream;

                // Connect WebSocket
                state.ws = new WebSocket(`${WS_BASE}/ws/recognition`);

                state.ws.onopen = () => {
                    state.ws.send(JSON.stringify({
                        type: 'authenticate',
                        token: state.token
                    }));
                };

                state.ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    handleWSMessage(data);
                };

                state.ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    alert('Connection error. Please try again.');
                };

                state.ws.onclose = () => {
                    console.log('WebSocket closed');
                    state.isRecording = false;
                };

                state.isRecording = true;

                // Start sending frames
                sendFrames();
            } catch (error) {
                console.error('Error starting recording:', error);
                alert('Could not access camera: ' + error.message);
            }
        }

        function sendFrames() {
            if (!state.isRecording || !state.ws || state.ws.readyState !== WebSocket.OPEN) {
                return;
            }

            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(video, 0, 0);
            const frameData = canvas.toDataURL('image/jpeg', 0.8);

            state.ws.send(JSON.stringify({
                type: 'frame',
                frame: frameData
            }));

            setTimeout(sendFrames, 100); // 10 FPS
        }

        function handleWSMessage(data) {
            switch (data.type) {
                case 'session_started':
                    state.currentSession = data.session_id;
                    console.log('Session started:', data.session_id);
                    break;

                case 'prediction':
                    state.currentPrediction = data.label;
                    state.confidence = data.confidence;
                    updatePredictionDisplay();
                    break;

                case 'letter_detected':
                    state.sentence = data.sentence;
                    updateSentenceDisplay();
                    break;

                case 'word_registered':
                    state.registeredWords = data.words;
                    updateWordsDisplay();
                    break;

                case 'cleared':
                    state.sentence = '';
                    state.registeredWords = [];
                    updateSentenceDisplay();
                    updateWordsDisplay();
                    break;

                case 'error':
                    console.error('WebSocket error:', data.message);
                    alert('Error: ' + data.message);
                    break;
            }
        }

        function stopRecording() {
            if (state.ws) {
                state.ws.send(JSON.stringify({ type: 'stop' }));
                state.ws.close();
                state.ws = null;
            }

            if (state.videoStream) {
                state.videoStream.getTracks().forEach(track => track.stop());
                state.videoStream = null;
            }

            state.isRecording = false;
            state.currentPrediction = null;
            state.confidence = 0;
        }

        function registerWord() {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({ type: 'register_word' }));
            }
        }

        function clearText() {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({ type: 'clear' }));
            }
        }

        // UI Update Functions
        function updatePredictionDisplay() {
            const predEl = document.getElementById('prediction');
            const confEl = document.getElementById('confidence');
            if (predEl) predEl.textContent = state.currentPrediction || '---';
            if (confEl) confEl.textContent = state.confidence ? (state.confidence * 100).toFixed(1) + '%' : '0%';
        }

        function updateSentenceDisplay() {
            const sentEl = document.getElementById('sentence');
            if (sentEl) sentEl.textContent = state.sentence || '';
        }

        function updateWordsDisplay() {
            const wordsEl = document.getElementById('words');
            if (wordsEl) {
                wordsEl.textContent = state.registeredWords.join(' • ') || 'No words registered yet';
            }
        }

        // Page Components
        function LoginPage() {
            return `
                <div class="min-h-screen gradient-bg flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
                        <div class="text-center mb-8">
                            <h1 class="text-4xl font-bold text-gray-800 mb-2">ASL Recognition</h1>
                            <p class="text-gray-600">Sign language to text converter</p>
                        </div>

                        <form onsubmit="event.preventDefault(); handleLogin();" class="space-y-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                                <input type="text" id="login-username" required
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                <input type="password" id="login-password" required
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition">
                            </div>

                            <button type="submit"
                                class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3 rounded-lg font-semibold hover:from-purple-700 hover:to-indigo-700 transition shadow-lg">
                                Login
                            </button>
                        </form>

                        <div class="mt-6 text-center">
                            <p class="text-gray-600">Don't have an account?
                                <button onclick="state.currentPage='register'; render();" 
                                    class="text-purple-600 font-semibold hover:text-purple-800">
                                    Register
                                </button>
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        function RegisterPage() {
            return `
                <div class="min-h-screen gradient-bg flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
                        <div class="text-center mb-8">
                            <h1 class="text-4xl font-bold text-gray-800 mb-2">Create Account</h1>
                            <p class="text-gray-600">Join ASL Recognition platform</p>
                        </div>

                        <form onsubmit="event.preventDefault(); handleRegister();" class="space-y-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                                <input type="text" id="reg-username" required
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                                <input type="email" id="reg-email" required
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                <input type="password" id="reg-password" required minlength="6"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition">
                            </div>

                            <button type="submit"
                                class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3 rounded-lg font-semibold hover:from-purple-700 hover:to-indigo-700 transition shadow-lg">
                                Register
                            </button>
                        </form>

                        <div class="mt-6 text-center">
                            <p class="text-gray-600">Already have an account?
                                <button onclick="state.currentPage='login'; render();" 
                                    class="text-purple-600 font-semibold hover:text-purple-800">
                                    Login
                                </button>
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        function RecognitionPage() {
            return `
                <div class="min-h-screen bg-gray-100">
                    <!-- Header -->
                    <header class="gradient-bg shadow-lg">
                        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                            <h1 class="text-2xl font-bold text-white">ASL Recognition</h1>
                            <div class="flex items-center gap-4">
                                <span class="text-white">Welcome, ${state.user?.username || 'User'}</span>
                                <button onclick="logout()" 
                                    class="bg-white text-purple-600 px-4 py-2 rounded-lg font-semibold hover:bg-gray-100 transition">
                                    Logout
                                </button>
                            </div>
                        </div>
                    </header>

                    <div class="max-w-7xl mx-auto px-4 py-8">
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <!-- Camera Section -->
                            <div class="lg:col-span-2">
                                <div class="bg-white rounded-2xl shadow-xl p-6">
                                    <h2 class="text-2xl font-bold mb-4">Live Camera Feed</h2>
                                    
                                    <div class="relative bg-black rounded-lg overflow-hidden ${state.isRecording ? 'recording' : ''}">
                                        <video id="video" autoplay playsinline muted 
                                            class="w-full h-auto"></video>
                                        
                                        ${!state.isRecording ? `
                                            <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50">
                                                <p class="text-white text-xl">Camera inactive</p>
                                            </div>
                                        ` : ''}
                                        
                                        <!-- ROI Overlay -->
                                        <div class="absolute top-20 left-1/2 transform -translate-x-1/2 w-80 h-80 border-4 border-green-500 rounded-lg pointer-events-none"></div>
                                    </div>

                                    <div class="mt-6 flex gap-4">
                                        ${!state.isRecording ? `
                                            <button onclick="startRecording()"
                                                class="flex-1 bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition shadow-lg">
                                                🎥 Start Recognition
                                            </button>
                                        ` : `
                                            <button onclick="stopRecording(); render();"
                                                class="flex-1 bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700 transition shadow-lg">
                                                ⏹️ Stop Recognition
                                            </button>
                                        `}
                                    </div>
                                </div>

                                <!-- Current Prediction -->
                                <div class="mt-6 bg-white rounded-2xl shadow-xl p-6">
                                    <h3 class="text-xl font-bold mb-4">Current Prediction</h3>
                                    <div class="flex items-center justify-between">
                                        <div>
                                            <p class="text-sm text-gray-600">Detected Letter:</p>
                                            <p id="prediction" class="text-4xl font-bold text-purple-600">---</p>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-sm text-gray-600">Confidence:</p>
                                            <p id="confidence" class="text-2xl font-bold text-green-600">0%</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Output Section -->
                            <div class="space-y-6">
                                <!-- Current Sentence -->
                                <div class="bg-white rounded-2xl shadow-xl p-6">
                                    <h3 class="text-xl font-bold mb-4">Current Sentence</h3>
                                    <div class="bg-gray-50 rounded-lg p-4 min-h-32 border-2 border-gray-200">
                                        <p id="sentence" class="text-lg font-mono break-words"></p>
                                    </div>
                                    
                                    <div class="mt-4 flex gap-2">
                                        <button onclick="registerWord()"
                                            class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
                                            ✓ Register Word
                                        </button>
                                        <button onclick="clearText()"
                                            class="bg-red-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-red-700 transition">
                                            Clear
                                        </button>
                                    </div>
                                </div>

                                <!-- Registered Words -->
                                <div class="bg-white rounded-2xl shadow-xl p-6">
                                    <h3 class="text-xl font-bold mb-4">Registered Words</h3>
                                    <div class="bg-gradient-to-br from-purple-50 to-indigo-50 rounded-lg p-4 min-h-32 border-2 border-purple-200">
                                        <p id="words" class="text-sm text-gray-700 break-words">No words registered yet</p>
                                    </div>
                                </div>

                                <!-- Instructions -->
                                <div class="bg-gradient-to-br from-blue-50 to-purple-50 rounded-2xl shadow-xl p-6 border-2 border-purple-200">
                                    <h3 class="text-lg font-bold mb-3 text-purple-800">📋 Instructions</h3>
                                    <ul class="space-y-2 text-sm text-gray-700">
                                        <li>✋ Position hand in green box</li>
                                        <li>✍️ Sign letters steadily</li>
                                        <li>⏱️ Hold each sign for stable detection</li>
                                        <li>✓ Click "Register Word" to save</li>
                                        <li>🗑️ Use "Clear" to reset sentence</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Event Handlers
        function handleLogin() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            login(username, password);
        }

        function handleRegister() {
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            register(username, email, password);
        }

        // Render Function
        function render() {
            const app = document.getElementById('app');
            
            let content = '';
            switch (state.currentPage) {
                case 'login':
                    content = LoginPage();
                    break;
                case 'register':
                    content = RegisterPage();
                    break;
                case 'recognition':
                    content = RecognitionPage();
                    break;
                default:
                    content = LoginPage();
            }
            
            app.innerHTML = content;

            // If on recognition page and video exists, maintain stream
            if (state.currentPage === 'recognition' && state.videoStream) {
                setTimeout(() => {
                    const video = document.getElementById('video');
                    if (video && state.videoStream) {
                        video.srcObject = state.videoStream;
                    }
                }, 100);
            }
        }

        // Initialize
        if (state.token) {
            apiCall('/api/auth/me')
                .then(user => {
                    state.user = user;
                    state.currentPage = 'recognition';
                    render();
                })
                .catch(() => {
                    localStorage.removeItem('token');
                    state.token = null;
                    render();
                });
        } else {
            render();
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopRecording();
        });
    </script>
</body>
</html>
