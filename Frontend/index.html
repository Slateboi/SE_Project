<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Language Translator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <header>
      <h1 class="animated-title">Sign Language Translator</h1>
      <p>Translate gestures into text — instantly and intelligently.</p>
    </header>

    <main class="main-container">
      <section class="video-section">
        <video id="camera" autoplay playsinline></video>
      </section>

      <section class="output-section">
        <h2>Translated Output</h2>
        <div id="output">Waiting for input...</div>
      </section>
    </main>

    <footer>
      <button id="startBtn">Start Translation</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
