<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Sign Language Translator</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1 class="login-title">Create Account</h1>
      <p class="login-subtitle">Join us and start translating signs</p>

      <form id="signupForm">
        <input type="text" placeholder="Username" id="newUsername" required>
        <input type="email" placeholder="Email" id="email" required>
        <input type="password" placeholder="Password" id="newPassword" required>
        <button type="submit">Sign Up</button>
      </form>

      <p class="signup-text">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </div>

  <script>
    const signupForm = document.getElementById('signupForm');
    signupForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('newUsername').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('newPassword').value;

      if(username && email && password){
        alert(`Account created for ${username}! Redirecting to login...`);
        window.location.href = "login.html";
      } else {
        alert("Please fill in all fields");
      }
    });
  </script>
</body>
</html>
